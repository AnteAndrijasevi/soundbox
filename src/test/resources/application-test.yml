# Integration tests run against a real PostgreSQL provided by Testcontainers
# (@ServiceConnection in TestcontainersConfiguration). The datasource is supplied by
# the container; Flyway migrations, `ddl-auto: validate` and the Postgres dialect are
# inherited from the base application.yml — no H2 approximation here.
jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-testing-purposes
  expiration: 86400000

spring:
  cache:
    type: none   # no Redis in tests; @Cacheable becomes a no-op

app:
  rate-limit:
    enabled: false   # integration tests share 127.0.0.1 and would trip the limit
