spring:
  application:
    name: soundbox

  datasource:
    url: jdbc:postgresql://localhost:5432/soundbox
    username: soundbox
    password: soundbox

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: moj-super-tajni-kljuc-koji-mora-biti-dovoljno-dugacak-za-hs256
  expiration: 86400000

musicbrainz:
  base-url: https://musicbrainz.org/ws/2
  user-agent: soundbox/1.0
  cover-art-url: https://coverartarchive.org

itunes:
  base-url: https://itunes.apple.com

springdoc:
  api-docs:
    path: /api-docs          # matches the permitAll rule in SecurityConfig
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: soundbox
    description: A sonic memory log — every listener is a curator

resilience4j:
  circuitbreaker:
    # health indicator off so an external-API outage doesn't fail the app's own healthcheck;
    # circuit state is still exported to metrics/prometheus
    configs:
      default:
        register-health-indicator: false
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      musicbrainz:
        base-config: default
      itunes:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      musicbrainz:
        base-config: default
      itunes:
        base-config: default
